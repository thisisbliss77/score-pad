t="4.500" rx=".6"/><path fill-rule="evenodd" d="M13 4h8v12h-8zM15 6v3.500h4V6z"/><circle cx="6.500" cy="18.300" r="2.300"/><circle cx="16.800" cy="18.300" r="2.300"/><path d="M2.500 16L.8 19h3.400z"/>',flame:'<path d="M12.300 2c.8 3.200 5.700 5.600 5.700 11.300A6 6 0 0 1 6 13.300c0-2.700 1.300-4.600 2.900-6.200.1 2.300 1 3.600 2.300 4.200-.6-3.300.1-6.400 1.100-9.300z"/><path d="M12 14.300c1 1.300 2.300 2 2.300 3.600a2.300 2.300 0 0 1-4.600 0c0-1.100.8-1.900 1.500-2.600.2.700.5 1 .8 1.100-.2-.8-.2-1.500 0-2.100z" opacity=".45"/>',bowers:'<path d="M4 21.500V11a8 8 0 0 1 16 0v10.500M8.300 21.500V11.300a3.700 3.700 0 0 1 7.400 0v10.200" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 15h4.300M15.700 15H20M4 18.500h4.300M15.700 18.500H20" stroke="currentColor" stroke-width="1.600"/><circle cx="6.300" cy="5.800" r="1.700"/><circle cx="12" cy="2.900" r="1.700"/><circle cx="17.700" cy="5.800" r="1.700"/>',pinochle:'<circle cx="8.800" cy="14.500" r="5.600" fill="none" stroke="currentColor" stroke-width="2.200"/><circle cx="15.200" cy="14.500" r="5.600" fill="none" stroke="currentColor" stroke-width="2.200"/><path d="M8.800 3.400l2.300 2.500-2.300 2.500-2.300-2.500z"/>',farkle:'<rect x="2" y="2" width="11" height="11" rx="2.200" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="7.500" cy="7.500" r="1.700"/><path fill-rule="evenodd" d="M11.500 9.500h8.500a2.500 2.500 0 0 1 2.500 2.500v8a2.500 2.500 0 0 1-2.500 2.500h-8a2.500 2.500 0 0 1-2.500-2.500v-8a2.500 2.500 0 0 1 2-2.500zM11.65 13a1.25 1.25 0 1 0 2.5 0a1.25 1.25 0 1 0 -2.5 0zM17.35 13a1.25 1.25 0 1 0 2.5 0a1.25 1.25 0 1 0 -2.5 0zM14.5 16a1.25 1.25 0 1 0 2.5 0a1.25 1.25 0 1 0 -2.5 0zM11.65 19a1.25 1.25 0 1 0 2.5 0a1.25 1.25 0 1 0 -2.5 0zM17.35 19a1.25 1.25 0 1 0 2.5 0a1.25 1.25 0 1 0 -2.5 0z"/>',cup:'<path d="M3.500 10h12.500l-1.600 11H5.100z"/><rect x="2.800" y="8.300" width="13.900" height="2.200" rx="1"/><g transform="rotate(18 18.500 5.500)"><rect x="15" y="2" width="7" height="7" rx="1.500" fill="none" stroke="currentColor" stroke-width="1.800"/><circle cx="17" cy="4" r=".9"/><circle cx="20" cy="7" r=".9"/></g>',crown5:'<path d="M3 18L2 8l3.700 3.600L7.600 5.200l2.600 5.800L12 3.500l1.800 7.500 2.600-5.800 1.900 6.400L22 8l-1 10z"/><rect x="3" y="19.200" width="18" height="2.300" rx="1"/>',kapelo:'<circle cx="12" cy="12" r="8.600" fill="none" stroke="currentColor" stroke-width="2.400"/><path d="M8.300 8.300l7.400 7.400M15.700 8.300l-7.400 7.400" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round"/>',compass:'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 8l-2.500 5.500L8 16l2.500-5.500z"/>'},Ae=Object.create(null);function Pe(e){return"string"==typeof e.rk&&Ae[e.rk]?Ae[e.rk]:"string"==typeof e.title&&Ae[e.title]?Ae[e.title]:null}function Le(e){var t=Pe(e);return t?" themed t-"+t.slug:""}function Ye(e,t){return e&&Ce[e.icon]?'<span class="gi'+(t?" "+t:"")+" themed t-"+e.slug+'"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">'+Ce[e.icon]+"</svg></span>":""}[["Hearts","hearts","heart"],["Spades","spades","spade"],["Euchre","euchre","bowers"],["Pinochle","pinochle","pinochle"],["Oh Hell","ohhell","flame"],["Wizard","wizard","hat"],["Gin Rummy","gin","martini"],["Rummy 500","rummy","r500"],["Canasta","canasta","basket"],["Cribbage","cribbage","pegs"],["Phase 10","phase10","steps"],["Uno","uno","reverse"],["Golf","golf","flag"],["Five Crowns","fivecrowns","crown5"],["Mexican Train","train","train"],["Farkle","farkle","farkle"],["Scrabble","scrabble","tile"],["Yahtzee","yahtzee","cup"],["Biriba","biriba","meander"],["Xeri","xeri","onecard"],["Diloti","diloti","pluscard"],["Koum Kan","kumkan","kapelo"],["Tavli","tavli","board"],["Lost Cities","lostcities","compass"]].forEach((function(e){Ae[e[0]]={slug:e[1],icon:e[2]}})),function(){var e="";Object.keys(Ae).forEach((function(t){var n=Ae[t],r='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white">'+Ce[n.icon].replace(/currentColor/g,"white")+"</svg>";e+=".t-"+n.slug+' .card.back{background:var(--accent) url("data:image/svg+xml,'+encodeURIComponent(r).replace(/'/g,"%27")+'") center/auto 62% no-repeat;border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 0 3px rgba(255,255,255,.5),0 1px 2px rgba(0,0,0,.18)}\n'}));var t=document.createElement("style");t.textContent=e,document.head.appendChild(t)}();var Ne=["Setup","Deal","Play","Scoring","Winning"],Be={Hearts:["4 players, each for themselves. Standard 52-card deck, aces high, no trump.","Deal 13 cards each. Before play, pass 3 cards: left on the first hand, right on the second, across on the third, and no pass on the fourth, then repeat.","The 2 of clubs leads. Follow suit if you can. Hearts cannot be led until a heart has been played on an earlier trick, unless you hold nothing else. Many groups also bar hearts and the queen of spades from the first trick.","Each heart taken is 1 point and the queen of spades is 13. If you take all 26 points (shooting the moon), you choose: take 26 off your own score, or add 26 to every other player.","The game ends when someone has 100 or more at the end of a hand. Lowest total wins. If the lowest scores are tied, play another hand."],Spades:["4 players in two partnerships, partners facing each other. Standard 52-card deck. Spades are always trump.","Deal 13 cards each. Starting left of the dealer, each player bids the number of tricks they expect to take, and partners' bids are added together. A bid of nil means taking no tricks at all.","The player left of the dealer leads. Follow suit if you can. Spades cannot be led until one has been played on another suit, unless you hold nothing else.","Made bid: 10 per trick bid plus 1 per extra trick (a bag). Missed bid: minus 10 per trick bid. Every 10 bags costs 100. Nil made is plus 100 and nil failed is minus 100, on top of the partner's own bid.","First team to 500 wins. If both pass 500 on the same hand, the higher score wins."],Euchre:["4 players in two partnerships. 24 cards: 9 through ace in each suit.","Deal 5 cards each in groups of 2 and 3, then turn the next card face up.","In turn, each player may order the turned-up suit as trump (the dealer picks that card up) or pass. If all pass, a second round lets players name another suit. The maker may play alone. The jack of trump (right bower) is highest, then the other jack of the same colour (left bower), which counts as a trump. Follow suit.","Makers take 3 or 4 tricks: 1 point. All 5 tricks: 2 points. All 5 playing alone: 4 points. Makers take fewer than 3 (euchred): the defenders score 2.","First team to 10 wins."],Pinochle:["4 players in two partnerships. 48-card pinochle deck: two each of 9, jack, queen, king, 10 and ace in every suit. Cards rank ace, 10, king, queen, jack, 9.","Deal 12 cards each. Players bid for the right to name trump. The minimum bid is 250.","The bid winner names trump, then their partner passes four cards across and gets four back. Everyone shows meld. Then play 12 tricks: follow suit, beat the best card played so far if you can, and trump if you have none of the suit led.","Meld: run 150, aces around 100, kings around 80, queens around 60, jacks around 40, pinochle (queen of spades with jack of diamonds) 40, royal marriage 40, marriage 20, 9 of trump 10. Tricks: 10 for each ace, 10 and king taken, plus 10 for the last trick, 250 in all. A bidding team that falls short loses the bid amount and scores nothing for the hand. Some groups drop the last zero from every value.","First team to 1,500 wins. If both pass it on the same hand, the bidding team wins."],"Oh Hell":["3 to 7 players. Standard 52-card deck.","The hand size changes by one card every deal. A common sequence starts at 10 cards each (8 with six players, 7 with seven), goes down to 1 and comes back up. Turn the next card to set trump.","Starting left of the dealer, each player bids the exact number of tricks they will take. The dealer bids last and may not make the bids add up to the number of tricks (some groups drop this rule). Follow suit if you can.","Score 1 point per trick taken, plus a 10 bonus for an exact bid. A simpler version gives 10 plus the bid for an exact bid and nothing for a miss.","Highest total after the last hand wins."],Wizard:["3 to 6 players. 60-card deck: a standard 52 plus 4 Wizards and 4 Jesters.","Deal 1 card each in the first round, 2 in the second, and so on until the whole deck is dealt. Turn the next card for trump. A turned Jester means no trump, a turned Wizard lets the dealer choose, and the last round has no trump.","Each player bids an exact number of tricks. Follow suit, but a Wizard or Jester may be played at any time. The first Wizard played wins the trick. Jesters lose, unless every card is a Jester, when the first one wins. If a Jester is led, the next card sets the suit.","Exact bid: 20 plus 10 per trick taken. Missed bid: minus 10 for each trick over or under.","Highest total after the final round wins."],"Gin Rummy":["2 players. Standard 52-card deck, ace low. Face cards count 10 and aces 1.","Deal 10 cards each. Turn the next card face up to start the discard pile.","On your turn draw the top card of the stock or the discard pile, then discard one. You may knock when your unmatched cards (deadwood) total 10 or less. The opponent may lay off cards on the knocker's melds, but not after gin.","The knocker scores the difference in deadwood. Gin (no deadwood) scores a bonus plus the opponent's deadwood. If the opponent has equal or less deadwood, they score the difference plus an undercut bonus. Printed rules differ on the bonuses: 25 each is common, and others use 20 for gin and 10 for an undercut. Agree before you start.","First to 100 wins. Some players then add 100 for game and 20 for each hand won."],"Rummy 500":["2 to 8 players. Standard 52-card deck plus jokers. Use two decks for 5 or more players.","Deal 7 cards each (13 each with 2 players). Turn one card up to start the discard pile, which is spread so every card shows.","Draw from the stock, or take a card from anywhere in the discard pile along with every card on top of it. The card you reached for must be melded at once. Meld sets and runs, lay off on any meld, then discard. The hand ends when a player is out of cards or the stock runs out.","Add up the cards you melded and subtract the cards left in your hand. Aces 15 (1 when melded as ace, 2, 3), face cards 10, jokers 15, others face value.","The game ends when someone reaches 500 at the end of a hand. Highest total wins."],Canasta:["4 players in two partnerships. Two 52-card decks plus 4 jokers (108 cards). Jokers and 2s are wild.","Deal 11 cards each. Turn one card up to start the discard pile. Red 3s are laid on the table and replaced from the stock.","Draw, meld, discard. Melds are 3 or more cards of one rank, with at least 2 natural cards and at most 3 wild. Seven or more make a canasta. A team's first meld must reach a minimum: 15 if below zero, 50 up to 1,495, 90 from 1,500, 120 from 3,000. A team needs a canasta to go out.","Natural canasta 500, mixed 300, going out 100 (200 concealed), each red 3 is 100 (800 for all four), or minus that if your team has no meld. Cards: joker 50, 2 and ace 20, king down to 8 are 10, 7 down to 4 and black 3s are 5. Subtract cards left in hand.","The game ends when a team has 5,000 or more at the end of a hand. The higher total wins."],Cribbage:["2 players. Standard 52-card deck and a cribbage board. Kings high, aces low. Face cards count 10.","Deal 6 cards each. Each player discards 2 face down to form the crib, which belongs to the dealer. Cut for the starter card. If it is a jack, the dealer pegs 2.","Starting with the non-dealer, play cards alternately, announcing the running total up to 31. Peg 2 for making 15, 2 for a pair, 1 per card for runs, and 1 for playing the last card before 31 (2 if it makes exactly 31).","After play, count hands with the starter (non-dealer first), then the crib. Each 15 is 2, each pair 2, runs 1 per card, a 4-card flush 4 (5 with the starter), and the jack of the starter's suit 1. The crib scores a flush only if all five cards match.","First to 121 wins, even in the middle of a hand."],"Phase 10":["2 to 6 players. The 108-card Phase 10 deck: numbers 1 to 12 in four colours, 8 Wilds and 4 Skips.","Deal 10 cards each. Turn one card up to start the discard pile.","Draw, then discard. Lay down your current phase when you hold all of it, then add cards to any laid-down phase. Phases: 1) two sets of 3. 2) set of 3 and run of 4. 3) set of 4 and run of 4. 4) run of 7. 5) run of 8. 6) run of 9. 7) two sets of 4. 8) 7 cards of one colour. 9) set of 5 and set of 2. 10) set of 5 and set of 3.","When someone goes out, the others score the cards left in hand: 1 to 9 are 5 each, 10 to 12 are 10 each, Skip 15, Wild 25. Anyone who completed their phase moves on to the next.","The first player to complete phase 10 wins. If several finish it in the same hand, the lowest total wins."],Uno:["2 to 10 players. The 108-card Uno deck.","Deal 7 cards each. Turn one card up to start the discard pile.","Match the top card by colour, number or symbol, or play a Wild. If you cannot play, draw a card. Say Uno when you are down to one card, or draw 2 if you are caught.","The player who goes out scores the cards left in everyone else's hands: number cards at face value, Draw Two, Reverse and Skip 20 each, Wild and Wild Draw Four 50 each.","First to 500 wins."],Golf:["2 to 8 players with two 52-card decks and 4 jokers. This is the 8-card version.","Deal 8 cards each, face down in two rows of four. Each player turns any two face up. Turn one card up to start the discard pile.","Draw from the stock or the discard pile and either swap it for one of your eight cards or discard it. If you discard a card drawn from the stock, turn one of your cards face up, unless it is your last face-down card: you may leave that one down and skip. When one player has all eight face up, everyone else gets one more turn.","Aces 1, 2 to 10 face value, jacks and queens 10, kings 0, jokers minus 5. Two equal cards in the same column cancel to 0, except jokers, which keep their minus 5 each.","Matching columns earn a bonus and do not need to be next to each other: two columns of the same rank minus 10, three columns minus 15, all four columns minus 20. Four jokers in two columns score minus 30 in all.","Play 9 deals (holes). Lowest total wins."],"Five Crowns":["1 to 7 players. The 116-card Five Crowns deck: two sets of five suits running 3 to king, plus 6 jokers.","Eleven rounds. Deal 3 cards each in the first round, 4 in the second, up to 13 in the last. The wild card changes each round to match the number dealt: 3s first, kings last. Jokers are always wild.","Draw, then discard. Go out by arranging your whole hand into books (same rank) and runs (same suit) with one discard left over. Everyone else then gets one more turn.","Score the cards you could not meld: 3 to 10 at face value, jacks 11, queens 12, kings 13, the round's wild card 20, jokers 50.","Lowest total after the kings round wins."],"Mexican Train":["Best with 4 or more players. A double-twelve domino set (91 tiles), a hub and a marker for each player.","Shuffle face down. Draw 15 tiles each with up to 4 players, 12 each with 5 or 6, 10 each with 7 or 8, and 8 each with 9 or 10. The double twelve starts the first round in the hub, the double eleven the second, and so on down.","Build your own train out from the hub. If you cannot play, draw one tile. If you still cannot, put your marker on your train, which opens it to everyone. Anyone may play on the Mexican train. A double must be covered before play moves on.","When a player goes out, the others score the pips left in hand.","Lowest total after 13 rounds wins."],Farkle:["2 or more players and six dice.","No deal. Each player rolls one die and the highest goes first.","Roll all six dice and set aside at least one scoring die, then bank your points or roll the rest. You must score 500 or more in a single turn before you can bank for the first time. A roll with nothing to score is a farkle and loses the turn's points. If all six dice score, roll them all again. Many groups require 500 in one turn to get on the board.","A single 1 is 100 and a single 5 is 50. Three 1s are 1,000. Three of any other number is 100 times that number. Four of a kind 1,000, five 2,000, six 3,000. A 1-to-6 straight or three pairs 1,500. Many sets add two triplets 2,500. Farkle has no single official rulebook, so check the card in your set.","When someone banks 10,000 or more, every other player gets one last turn. Highest total wins."],Scrabble:["2 to 4 players. A Scrabble board, 100 letter tiles and a rack each.","No deal. Each player draws one tile and the closest to A goes first (a blank beats any letter). Everyone then draws 7 tiles.","On your turn, play a word that connects to the tiles on the board, swap tiles, or pass. Draw back up to 7 after playing. The first word must cover the centre square.","Add the letter values of every word formed, applying premium squares only on the turn they are covered. Using all 7 tiles in one turn adds 50.","The game ends when the bag is empty and one player has used all their tiles, or when nobody can play. Subtract unplayed tiles from each score. The player who went out adds everyone else's. Highest total wins."],Yahtzee:["1 or more players, five dice and one score column each.","No deal. Roll to decide who goes first.","On your turn roll up to three times, keeping any dice between rolls. Then fill in exactly one category, even if it scores 0.","Ones to Sixes: the sum of that number. 3 and 4 of a kind: total of all dice. Full house 25, small straight 30, large straight 40, Yahtzee 50, Chance: total of all dice. Upper bonus 35 at 63 or more. Each extra Yahtzee is 100 if you already scored 50 in the Yahtzee box.","Highest total after all 13 categories are filled wins."],Biriba:["4 players in two partnerships (2 to 6 can play). Two 52-card decks plus 4 jokers (108 cards). Jokers and 2s are wild.","Deal 11 cards each. Set aside two more face-down packets of 11, the biribakia. Turn one card up to start the discard pile. In the full rules its suit becomes the bonus suit (kozi).","Draw from the stock or take the whole discard pile, meld, then discard. Melds are runs of 3 or more in one suit or sets of 3 or more of a rank, with at most one wild card each (many groups allow runs only). A meld of 7 or more is a biriba. Once your team has a biriba, the first of you to run out of cards picks up a biribaki. After that, a player goes out by discarding their last card.","Cards: joker 20, ace 15, 2s and 8 up to king 10, 3 to 7 are 5. Melded cards count for you and cards in hand against you. A biriba is 200 clean or 100 with a wild card, doubled in the bonus suit. A biriba of equal cards is 300 or 150. Going out 100. Not taking your biribaki costs 100.","Play to an agreed target, usually 5,000 (shorter games use 2,000 to 3,500). A team must pass the target to win."],Xeri:["2 players (4 can play in partnerships). Standard 52-card deck.","Deal 6 cards each and 4 face up in a pile on the table. Deal 6 more each whenever both hands are empty, until the deck runs out.","If the top card of the four on the table is a jack, it goes to the bottom of the deck and another card is dealt on top.","The dealer reveals the bottom card of the deck so both players can see it; it goes to the dealer in the last hand. If it’s a jack, the next card up is revealed too.","Play one card onto the pile each turn. If it matches the rank of the top card you capture the whole pile. A jack captures any pile. Capturing a pile of just one card by matching it is a xeri. Cards left at the end go to whoever captured last.","Captured cards go face down in your own taken pile. A xeri is kept face up, peeking out of it, so everyone can see how many each player has.","Most cards 3. Each ace, king, queen, jack and 10 is 1, with 1 extra for the 10 of diamonds. The 2 of clubs is 1. That makes 25 a deal. Each xeri adds 10, or 20 for a jack captured by a jack.","Commonly first to 151 at the end of a deal, or play an agreed number of deals."],"Koum Kan":["2 to 4 players. Two standard decks with both jokers from each: 108 cards. Jokers are wild.","Deal 10 cards each, dealing to the right, and turn one card face up beside the deck to start the discard pile. Play goes to the right.","Draw one card, from the deck or the top of the discard pile, then meld if you like, then discard. Runs are 3 or more in a row in one suit; an ace can go low (A-2-3) or high (Q-K-A) but a run can’t wrap round or use both. Sets are 3 or 4 of a rank with no suit repeated, so a set of four is closed. A joker must be declared as an exact card: its suit in a set, its place in a run. Once you’ve melded you may add to any meld, yours or anyone else’s, and swap a card for a joker declared as exactly that card; that joker must then be played in a meld before you discard. A joker can only be discarded as your very last card. When you meld or add, your score plus what’s left in your hand after discarding must stay under 100.","Go out by discarding your last card. Everyone else scores the cards left in their hand: 2 to 10 face value, jacks, queens and kings 10, aces 15, jokers 25. Points are bad.","At 100 or more you’re out. If at least two others are still under 100 you may buy a καπέλο (⊗): your score drops to the highest score still under 100. Everyone puts 1 chip in the pot to play; a player’s first καπέλο costs 2 chips, the next 4, then 8 and so on. The last player under 100 wins the pot."],Diloti:["2 players, or 4 in partnerships. Standard 52-card deck.","Deal 6 cards each and 4 face up on the table. Deal 6 more each whenever hands run out, until the deck is used.","Each turn play one card to capture, declare or lay. Capture a table card of the same value, or number cards that add up to it. Face cards capture only a matching face card. Declare by building a pile to a total you hold in your hand, to capture later. Clearing the whole table in one play is a xeri.","Most cards 4, each ace 1, the 10 of diamonds 2, the 2 of clubs 1. That makes 11 a deal. Each xeri adds 10.","First to 61 wins (121 for a longer game). If both pass it on the same deal, the higher score wins."],Tavli:["2 players. A backgammon board, 15 checkers each and two dice. Tavli is a match of three games played in rotation: Portes, Plakoto and Fevga.","No deal. Each player rolls one die and the higher roll starts the first game. After that the winner of each game starts the next.","Portes is standard backgammon without the doubling cube: single checkers can be hit and sent to the bar. In Plakoto a single checker is pinned in place instead of hit. In Fevga both players move in the same direction, there is no hitting, and one checker blocks a point.","A win is 1 point. A double win, where the loser has not borne off a single checker, is 2 points. For chips, a game also pays times the doubling cube: before rolling, a player may offer to double the stake; the other takes (and owns the cube) or drops and loses the game at the current stake.","Play to 3, 5 or 7 points."]};function De(e){var t,n=[e.rk,e.title];for(t=0;t<n.length;t++)if("string"==typeof n[t]&&Object.prototype.hasOwnProperty.call(Be,n[t]))return Be[n[t]];return null}function ze(e){var t=String(e||"").length;return t<=13?26:t<=17?22:t<=22?19:16}function He(){return'<button type="button" class="pmenu" data-act="smenu" aria-expanded="'+!!o.sheetMenu+'" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>'}function Fe(e){return o.sheetMenu?'<div class="pmenubox" role="menu"><button type="button" class="btn" role="menuitem" data-act="home">Home</button>'+(De(e)?'<button type="button" class="btn'+(o.rulesOpen?"
