              if (kkCanPlaceJoker(st, nh, jj)) return { swap: h[k].id, to: i };
            }
          }
        for (i = 0; i < st.melds.length; i++)
          for (k = 0; k < h.length; k++) {
            if (h.length < 2) break;
            if (kkWild(h[k]) && h.length > 3) continue;
            if (kkAdds(st.melds[i], h[k]).length) return { add: h[k].id, to: i, pick: 0 };
          }
      }
      if (!h.length) return null;
      var cand = h.filter(function (c) {
        return !kkWild(c);
      });
      if (!cand.length && h.length > 1 && st.melded[seat]) {
        for (var mi = 0; mi < st.melds.length; mi++)
          if (kkAdds(st.melds[mi], h[0]).length) return { add: h[0].id, to: mi, pick: 0 };
      }
      if (!cand.length) return { discard: h[0].id };
      var dead = MELD.best(h, KK_O).deadCards.filter(function (c) {
        return !kkWild(c);
      });
      var pool = dead.length ? dead : cand;
      pool.sort(function (a, b) {
        return kkVal(b) - kkVal(a);
      });
      // After melding, throw the card that keeps the hand under the limit.
      if (st.did) {
        var safeOne = cand.slice().sort(function (a, b) {
          return kkVal(b) - kkVal(a);
        })[0];
        if (!KK.safe(st, seat, h, pool[0])) return { discard: safeOne.id };
      }
      return { discard: (easy && !planning && !st.did ? pick(pool) : pool[0]).id };
    },
    // Check a discard against the rules; returns a warning, or '' when it's fine.
    discardProblem: function (st, seat, c) {
      var h = st.hands[seat];
      if (
        st.mustPlay &&
        h.some(function (x) {
          return x.id === st.mustPlay;
        })
      )
        return 'Play the joker you took back before you discard.';
      if (kkWild(c) && h.length > 1 && !KK.jokersStuck(st, seat))
        return 'A joker can only be discarded as your last card.';
      if (st.did && !KK.safe(st, seat, h, c))
        return (
          'You’ve melded this turn, but your ' +
          st.scores[seat] +
          ' plus the ' +
          (kkPts(h) - kkVal(c)) +
          ' left in your hand would reach 100. Meld or add more, or tap Undo.'
        );
      return '';
    },
    act: function (a, el, st, P) {
      if (st.phase === 'draw') {
        if (a === 'stock') return { draw: 'stock' };
        if (a === 'pile') return { draw: 'pile' };
        return null;
      }
      var h = st.hands[0],
        ui = P.ui;
      if (a === 'kklog') {
        PL.kklog = !PL.kklog;
        return true;
      }
      if (a === 'kkcancel') {
        ui.pending = null;
        ui.popOpts = null;
        return true;
      }
      if (ui.popOpts && a !== 'kkchoice') return null;
      if (a === 'card') return selToggle(P, el.dataset.id);
      if (a === 'kkchoice' && ui.pending) {
        var mv = ui.pending;
        mv.pick = +el.dataset.i;
        ui.pending = null;
        ui.popOpts = null;
        return mv;
      }
      var sel = selCards(P, h);
      if (a === 'meld') {
        if (sel.length < 3) return null;
        if (sel.length >= h.length) {
          P.msg = 'Keep at least one card to discard.';
          return true;
        }
        var it = kkInterps(sel);
        if (!it.length) {
          P.msg = 'That isn’t a run (3 or more in a suit) or a set (3 or 4 of a rank, no suit repeated).';
          return true;
        }
        var m1 = {
          meld: sel.map(function (c) {
            return c.id;
          }),
          pick: 0
        };
        if (!sel.some(kkWild)) return m1;
        ui.pending = m1;
        ui.popOpts = it.map(function (m) {
          return { label: kkDescribe(m), items: m.items };
        });
        return true;
      }
      if (a === 'mtarget') {
        var m = st.melds[+el.dataset.i];
        if (!st.melded[0]) {
          P.msg = 'You need to meld before you can add to melds or take jokers.';
          return true;
        }
        if (sel.length !== 1) {
          P.msg = 'Select one card, then tap the meld.';
          return true;
        }
        var c = sel[0];
        if (h.length < 2) {
          P.msg = 'Keep at least one card to discard.';
          return true;
        }
        var si = kkSwapIdx(m, c);
        if (si >= 0) {
          var jk = m.items[si].c,
            nh = h
              .filter(function (x) {
                return x !== c;
              })
              .concat([jk]);
          if (!kkCanPlaceJoker(st, nh, jk)) {
            P.msg = 'You couldn’t play that joker anywhere this turn, so you can’t take it.';
            return true;
          }
          return { swap: c.id, to: +el.dataset.i };
        }
        var ad = kkAdds(m, c);
        if (!ad.length) {
          P.msg = 'The ' + nameOf(c) + ' doesn’t fit that meld.';
          return true;
        }
        var m2 = { add: c.id, to: +el.dataset.i, pick: 0 };
        if (!kkWild(c)) return m2;
        ui.pending = m2;
        ui.popOpts = ad.map(function (x) {
          return {
            label: 'Joker as the ' + kkName(x.r, x.s),
            items: x.end === 'low' ? [x].concat(m.items) : m.items.concat([x])
          };
        });
        return true;
      }
      if (a === 'discard') {
        if (sel.length !== 1) return null;
        var pr = KK.discardProblem(st, 0, sel[0]);
        if (pr) {
          P.msg = pr;
          return true;
        }
        return { discard: sel[0].id };
      }
    },
    apply: function (st, seat, mv) {
      var h = st.hands[seat],
        who = seat === 0 ? 'You' : st.names[seat],
        s3 = seat === 0;
      if (mv.draw) {
        var c;
        if (mv.draw === 'pile') {
          c = st.pile.pop();
          st.backs = st.backs || {};
          st.backs[c.id] = (st.backs[c.id] || 0) + 1;
        } else {
          if (!st.stock.length) {
            st.reshuffles = (st.reshuffles || 0) + 1;
            if (st.reshuffles > 2 || st.pile.length < 2) {
              st.end = true;
              st.winner = -1;
              return { msg: 'The stock has run out again: the round ends and everyone counts their hand.' };
            }
            var top = st.pile.pop();
            st.stock = shuffle(st.pile);
            st.pile = [top];
          }
          c = st.stock.pop();
        }
        h.push(c);
        KK.sort(h);
        st.phase = 'act';
        st.did = false;
        st.mustPlay = null;
        KK.snapshot(st);
        return {
          msg: s3
            ? 'You ' + (mv.draw === 'pile' ? 'take' : 'draw') + ' the ' + nameOf(c) + '.'
            : who + (mv.draw === 'pile' ? ' takes the ' + nameOf(c) + '.' : ' draws.')
        };
      }
      if (mv.meld) {
        var cards = h.filter(function (x) {
            return mv.meld.indexOf(x.id) >= 0;
          }),
          it = kkInterps(cards)[mv.pick || 0];
        if (!it) return { msg: 'That meld isn’t valid.', bad: 1 };
        takeIds(h, mv.meld);
        var m = { owner: seat, type: it.type, s: it.s, r: it.r, lo: it.lo, hi: it.hi, items: it.items };
        kkOrder(m);
        st.melds.push(m);
        st.melded[seat] = true;
        st.did = true;
        if (mv.meld.indexOf(st.mustPlay) >= 0) st.mustPlay = null;
        return { msg: who + (s3 ? ' meld: ' : ' melds: ') + kkDescribe(m) + '.', pause: 900 };
      }
      if (mv.add) {
        var mm = st.melds[mv.to],
          card = h.filter(function (x) {
            return x.id === mv.add;
          })[0],
          opt = card && kkAdds(mm, card)[mv.pick || 0];
        if (!opt) return { msg: 'That card doesn’t fit.', bad: 1 };
        takeIds(h, [mv.add]);
        kkPlace(mm, opt);
        st.did = true;
        if (mv.add === st.mustPlay) st.mustPlay = null;
        return {
          msg:
            who +
            (s3 ? ' add ' : ' adds ') +
            (kkWild(card) ? 'a joker as the ' + kkName(opt.r, opt.s) : 'the ' + nameOf(card)) +
            ' to ' +
            (mm.owner === seat
              ? s3
                ? 'your'
                : 'its'
              : mm.owner === 0
                ? 'your'
                : st.names[mm.owner] + '’s') +
            ' meld.',
          pause: 800
        };
      }
      if (mv.swap) {
        var m3 = st.melds[mv.to],
          c2 = h.filter(function (x) {
            return x.id === mv.swap;
          })[0],
          idx = kkSwapIdx(m3, c2);
        if (idx < 0) return { msg: 'That card doesn’t match a joker there.', bad: 1 };
        takeIds(h, [mv.swap]);
        var j = m3.items[idx].c;
        m3.items[idx].c = c2;
        h.push(j);
        KK.sort(h);
        st.mustPlay = j.id;
        st.did = true;
        return {
          msg:
            who +
            (s3 ? ' swap in the ' : ' swaps in the ') +
            nameOf(c2) +
            ' and ' +
            (s3 ? 'take' : 'takes') +
            ' the joker' +
            (s3 ? ': play it before you discard.' : '.'),
          pause: 900
        };
      }
      if (mv.discard) {
        var d = h.filter(function (x) {
            return x.id === mv.discard;
          })[0],
          pr = KK.discardProblem(st, seat, d);
        if (pr && seat === 0) return { msg: pr, bad: 1 };
        takeIds(h, [mv.discard]);
        st.pile.push(d);
        st.did = false;
        st.mustPlay = null;
        st.snap = null;
        if (!h.length) {
          st.end = true;
          st.winner = seat;
          return {
            msg:
              who +
              (s3 ? ' discard the ' : ' discards the ') +
              nameOf(d) +
              ' and ' +
              (s3 ? 'go out!' : 'goes out!')
          };
        }
        st.phase = 'draw';
        st.next = (seat + 1) % st.n;
        return { msg: who + (s3 ? ' discard the ' : ' discards the ') + nameOf(d) + '.', pause: 700 };
      }
    },
    score: function (st) {
      return {
        pts: st.hands.map(function (h, i) {
          return i === st.winner ? 0 : kkPts(h);
        })
      };
    },
    record: function (g, st, res, P) {
      g.vs.kkLog = (st.log || []).slice(-400);
      var r = rowFor(g, P.seats[st.dealer] && P.seats[st.dealer].pid),
        cid = colId(g, 'Points');
      P.seats.forEach(function (s, i) {
        setCell(r, s.pid, cid, res.pts[i]);
      });
      // Busted players may buy a καπέλο while at least two others are still under 100.
      st.busted = P.seats
        .filter(function (s, i) {
          return st.scores[i] < 100 && total(g, s.pid) >= 100;
        })
        .map(function (s) {
          return s.pid;
        });
      st.kkAsk = null;
      var humans = P.seats
        .filter(function (s) {
          return s.human;
        })
        .map(function (s) {
          return s.pid;
        });
      st.busted.forEach(function (pid) {
        if (humans.indexOf(pid) >= 0 || !kkCanBuy(g, pid)) return;
        var n = (g.kk && g.kk.kap[pid]) || 0;
        if (n < 2 || Math.random() < 0.3) kkBuy(g, pid);
      });
      st.kkQueue = st.busted.filter(function (pid) {
        return humans.indexOf(pid) >= 0;
      });
      KK.nextAsk(g, st);
    },
    // Only jokers left and nowhere to put one: the joker rule would leave no legal move, so a joker may be discarded.
    jokersStuck: function (st, seat) {
      var h = st.hands[seat];
      if (!h.every(kkWild)) return false;
      if (!st.melded[seat]) return h.length < 3;
      return !st.melds.some(function (m) {
        return kkAdds(m, h[0]).length;
      });
    },
    nextAsk: function (g, st) {
      st.kkAsk = null;
      while (st.kkQueue && st.kkQueue.length) {
        var pid = st.kkQueue.shift();
        if (kkCanBuy(g, pid)) {
          st.kkAsk = { pid: pid, cost: kkCost(g, pid) };
          return;
        }
      }
    },
    over: function (g, st) {
      return !(st && st.kkAsk) && kkUnder(g).length <= 1;
    },
    winner: function (g) {
      return kkWinner(g);
    },
    view: function (st, P) {
      var my = KK.turn(st) === 0,
        sel = P.ui.sel || [];
      var out = seatChips(
        P,
        function (i) {
          return st.hands[i].length + ' cards · ' + st.scores[i] + ' pts' + (st.melded[i] ? ' · melded' : '');
        },
        st.next > 0 && !st.end ? st.next : -1
      );
      out += pilesHTML(st, my);
      // Melds sit together by player, side by side, wrapping onto more rows as needed.
      var owners = [];
      st.melds.forEach(function (m) {
        if (owners.indexOf(m.owner) < 0) owners.push(m.owner);
      });
      owners.sort(function (a, b) {
        return a - b;
      });
      var meldsHTML =
        '<div class="melds">' +
        (owners.length
          ? owners
              .map(function (o) {
                return (
                  '<div class="kkgroup"><span class="ml">' +
                  esc(o === 0 ? 'You' : st.names[o]) +
                  '</span><div class="kkmelds">' +
                  st.melds
                    .map(function (m, j) {
                      return m.owner !== o
                        ? ''
                        : '<div class="kmeld" data-pa="mtarget" data-i="' +
                            j +
                            '" role="button" aria-label="' +
                            esc(kkDescribe(m)) +
                            '"><span class="mcards">' +
                            m.items.map(kkItemHTML).join('') +
                            '</span></div>';
                    })
                    .join('') +
                  '</div></div>'
                );
              })
              .join('')
          : '<span class="pempty">No melds yet</span>') +
        '</div>';
      if (P.ui.popOpts)
        out +=
          '<div class="kkpop" role="dialog" aria-modal="true" aria-labelledby="kkpop-t"><div class="kkpopbox"><h3 id="kkpop-t">Play the joker as…</h3>' +
          P.ui.popOpts
            .map(function (o, i) {
              return (
                '<button type="button" class="kkopt" data-pa="kkchoice" data-i="' + i + '" aria-label="' + esc(o.label) + '">' +
                '<span class="kkbig">' + o.items.map(kkBigCardHTML).join('') + '</span><span class="kklab">' + esc(o.label) + '</span></button>'
              );
            })
            .join('') +
          '<button type="button" class="btn" data-pa="kkcancel">Cancel</button></div></div>';
      var lg = function (list) {
        return list && list.length
          ? '<ol>' + list.map(function (t) { return '<li>' + esc(forNames(t)) + '</li>'; }).join('') + '</ol>'
          : '<p class="note">Nothing yet.</p>';
      };
      out +=
        '<div class="kklogbar"><button type="button" class="btn small' + (PL.kklog ? ' on' : '') + '" data-pa="kklog" aria-expanded="' + !!PL.kklog + '">Log</button></div>' +
        (PL.kklog
          ? '<div class="kklog"><h4>This round</h4>' + lg(st.log) + '<h4>Previous round</h4>' + lg((G() && G().vs.kkLog) || null) + '</div>'
          : '');
      out += handButtons(st.hands[0] || [], {
        can: function () {
          return my && st.phase === 'act';
        },
        picked: function (c) {
          return sel.indexOf(c.id) >= 0;
        },
        mark: function (c) {
          return c.id === st.mustPlay;
        }
      });
      out += btns(
        my && st.phase === 'act'
          ? [
              btn('meld', 'Meld', false, sel.length >= 3 ? '' : ' disabled'),
              btn('discard', 'Discard', true, sel.length === 1 ? '' : ' disabled')
            ]
          : []
      );
      var hp = kkPts(st.hands[0] || []);
      return (
        out +
        note(my && st.mustPlay ? 'Play the outlined joker first.' : '') +
        note('Score ' + st.scores[0] + (easyMode() ? ' · hand ' + hp : '')) +
        meldsHTML
      );
    },
    doneLine: function (st, res, P) {
      return (
        (st.winner < 0
          ? 'Nobody went out.'
          : st.winner === 0
            ? 'You go out!'
            : st.names[st.winner] + ' goes out.') +
        ' You take ' +
        res.pts[0] +
        (res.pts[0] === 1 ? ' point.' : ' points.')
      );
    },
    detail: function (st, res, P) {
      var g = G(),
        out = resTable(
          P,
          P.seats.map(function (s, i) {
            return { name: st.names[i], v: [res.pts[i], total(g, s.pid) + kkMarks(g, s.pid)] };
          }),
          ['This round', 'Total']
        );
      (st.busted || []).forEach(function (pid) {
        if (pid === g.vs.me) return;
        out += note(
          playerName(g, pid) +
            (g.kk && g.kk.kap[pid] && total(g, pid) < 100
              ? ' busts and buys a καπέλο.'
              : ' busts and is out.')
        );
      });
      if (st.kkAsk)
        out +=
          '<p class="note">' +
          (st.kkAsk.pid === g.vs.me && !multiHuman() ? 'You’ve' : esc(playerName(g, st.kkAsk.pid)) + ' has') +
          ' reached ' +
          total(g, st.kkAsk.pid) +
          '. Buy a καπέλο for ' +
          st.kkAsk.cost +
          ' chips to come back in at ' +
          Math.max.apply(
            null,
            kkUnder(g).map(function (p) {
              return total(g, p.id);
            })
          ) +
          '?</p>';
      return out;
    },
    // After the round: answer a καπέλο offer, or let the computers finish once you're out.
    doneButtons: function (st, P) {
      var g = G();
      if (st.kkAsk)
        return [btn('kkyes', 'Buy καπέλο · ' + st.kkAsk.cost + ' chips', true), btn('kkno', 'Bow out')];
      if (
        !PL.over &&
        !PL.seats.some(function (s) {
          return s.human && total(g, s.pid) < 100;
        })
      )
        return [btn('kksim', 'See who wins', true), btn('leave', 'Score sheet')];
      return null;
    },
    // One line for the round log. Cards drawn from the stock stay private, even your own,
    // since in pass-and-play someone else may read the log.
    logLine: function (st, seat, mv, ev) {
      var who = seat === 0 ? 'You' : st.names[seat];
      if (mv.draw === 'stock') return who + (seat === 0 ? ' draw' : ' draws') + ' from the stock.';
      return ev.msg || '';
    },
    idle: function (a, el, st, P) {
      var g = G();
      if (a === 'kklog') {
        PL.kklog = !PL.kklog;
        return true;
      }
      if (!g || P.phase !== 'done') return false;
      if (a === 'kkyes' && st.kkAsk) {
        kkBuy(g, st.kkAsk.pid);
        P.msg = forNames(
          st.kkAsk.pid === g.vs.me
            ? 'You buy a καπέλο and come back in.'
            : playerName(g, st.kkAsk.pid) + ' buys a καπέλο.'
        );
        KK.nextAsk(g, st);
      } else if (a === 'kkno' && st.kkAsk) {
        P.msg =
          st.kkAsk.pid === g.vs.me ? forNames('You bow out.') : playerName(g, st.kkAsk.pid) + ' bows out.';
        KK.nextAsk(g, st);
      } else if (a === 'kksim') {
        KK.finish(g, P);
      } else return false;
      var over = KK.over(g, st);
      if (over) {
        g.over = true;
        g.endedAt = Date.now();
      }
      P.over = over;
      touch(g.id);
      render();
      return true;
    },
    // You're out: play the computers' remaining rounds straight through.
    finish: function (g, P) {
      for (var guard = 0; guard < 60 && kkUnder(g).length > 1; guard++) {
        var ctx = gmCtx(g);
        KK.prep(ctx, g);
        var st = KK.deal(ctx),
          k = 0;
        st.out0 = false;
        while (KK.turn(st) >= 0 && k++ < 3000) {
          var s = KK.turn(st);
          KK.apply(st, s, KK.ai(st, s, ctx.level));
        }
        KK.record(g, st, KK.score(st), { seats: ctx.seats });
      }
      P.msg = 'The computers play out the rest.';
    },
    nextLabel: 'Next round'
  });

  /* ---------- score sheets that follow each game's rules ----------
     Columns can be plain numbers, tick boxes (kind 'chk', stored 1 or blank) or choices (kind 'pick', stored 1, 2, 3 …).
     Columns marked auto are worked out from the others by the game's calc below. */
  function setIf(g, r, pid, name, v) {
    var c = g.columns.filter(function (x) {
      return x.name === name;
    })[0];
    if (!c) return false;
    if (v == null) {
      if (r.s[pid]) delete r.s[pid][c.id];
    } else setCell(r, pid, c.id, v);
    return true;
  }
  function hasCol(g, name) {
    return g.columns.some(function (c) {
      return c.name === name;
    });
  }
  function colsByName(g) {
    var o = {};
    g.columns.forEach(function (c) {
      o[c.name] = c.id;
    });
    return o;
  }
  function nv(r, pid, cid) {
    var v = cid ? cellVal(r, pid, cid) : null;
    return typeof v === 'number' ? v : null;
  }
  function setAuto(r, pid, cid, v) {
    if (!cid) return;
    if (v == null) {
      if (r.s[pid]) delete r.s[pid][cid];
    } else setCell(r, pid, cid, v);
  }
  // Spades: shared with play against the computer, so the sheet and the game agree.
  function spadesHand(bid, tricks, nil) {
    var made = tricks >= bid,
      bags = bid ? (made ? tricks - bid : 0) : tricks;
    var pts =
      (bid ? (made ? bid * 10 + bags : -bid * 10) : tricks) + (nil === 1 ? 100 : nil === 2 ? -100 : 0);
    return { bags: bags, pts: pts };
  }
  var CALC = {
    spades: function (g) {
      var c = colsByName(g);
      g.players.forEach(function (p) {
        var prev = 0;
        g.rounds.forEach(function (r) {
          var b = nv(r, p.id, c.Bid),
            t = nv(r, p.id, c.Tricks),
            nil = nv(r, p.id, c.Nil);
          if (t == null || (b == null && !nil)) {
            setAuto(r, p.id, c.Bags, null);
            setAuto(r, p.id, c.Points, null);
            return;
          }
          var x = spadesHand(b || 0, t, nil),
            pen = (Math.floor((prev + x.bags) / 10) - Math.floor(prev / 10)) * 100;
          prev += x.bags;
          setAuto(r, p.id, c.Bags, x.bags);
          setAuto(r, p.id, c.Points, x.pts - pen);
        });
      });
    },
    ohhell: function (g) {

  // Seat s seen from viewer k becomes (s - k) mod n.

    var R = ROT[kind],

    var sh = back ? (n - k) % n : k,

        return typeof s === 'number' && s >= 0 && s < n ? (s - sh + n) % n : s;
      };
    var rot = function (a) {
      if (!Array.isArray(a)) return a;
      var o = a.slice();
      for (var j = 0; j < n; j++) o[j] = a[(j + sh) % n];
      return o;
    };
    R.arr.forEach(function (key) {
      cl[key] = rot(cl[key]);
    });
    R.idx.forEach(function (key) {
      cl[key] = f(cl[key]);
    });
    (R.owner || []).forEach(function (key) {
      (cl[key] || []).forEach(function (m) {
        m.owner = f(m.owner);
      });
    });
    (R.seatItems || []).forEach(function (key) {
      (cl[key] || []).forEach(function (m) {
        m.seat = f(m.seat);
      });
    });
    (R.seatKeys || []).forEach(function (key) {
      if (cl[key]) {
        var o = {};
        Object.keys(cl[key]).forEach(function (s) {
          o[f(+s)] = cl[key][s];
        });
        cl[key] = o;
      }
    });
    if (cl.trick)
      cl.trick.forEach(function (t) {
        t.seat = f(t.seat);
      });
    if (cl.shown) {
      cl.shown.winner = f(cl.shown.winner);
      cl.shown.cards.forEach(function (t) {

      });
    }
    if (R.trains) {
      var tr = cl.trains,
        last = tr[n],
        firstN = rot(tr.slice(0, n));
      cl.trains = firstN.concat([last]);
      cl.pending = cl.pending >= 0 && cl.pending < n ? f(cl.pending) : cl.pending;

      [P.seats[0].pid, P.seats[1].pid].forEach(function (pid, t) {
        setCell(r, pid, cid, res[t].total);
        setIf(g, r, pid, 'Xeris', res[t].xn);
      });
    },
    doneLine: function (st, res) {
      return 'Deal scored: your team ' + res[0].total + ', the other team ' + res[1].total + '.';
    },
    detail: function (st, res, P) {
      var rows = [
        ['Cards taken', 'cards'],
        ['Most cards', 'most'],
        ['Card points', 'pts'],
        ['Xeri', 'xeri'],
        ['This deal', 'total']
      ];
      return (
        '<div class="sheet"><table class="rtable"><thead><tr><th></th><th>Your team</th><th>' + esc(P.seats[1].name + ' & ' + P.seats[3].name) + '</th></tr></thead><tbody>' +
        rows
          .map(function (r) {
            return (
              '<tr' + (r[1] === 'total' ? ' class="rt"' : '') + '><td>' + r[0] + '</td><td>' + res[0][r[1]] + (r[1] === 'xeri' && res[0].xn ? ' (' + res[0].xn + ')' : '') +
              '</td><td>' + res[1][r[1]] + (r[1] === 'xeri' && res[1].xn ? ' (' + res[1].xn + ')' : '') + '</td></tr>'
            );
          })
          .join('') +
        '</tbody></table></div>' +
        takenPilesHTML(
          [res[0].caps, res[1].caps],
          ['Your team', P.seats[1].name + ' & ' + P.seats[3].name],
          function (t, c) {
            return st.xc[t].concat(st.xc[t + 2]).some(function (x) {
              return x.id === c.id;
            });
          },
          XR.val
        )
      );
    },
    view: function (st, P) {
      var my = X4.turn(st) === 0,
        top = st.pile[st.pile.length - 1];
      var out = seatChips(
        P,
        function (i) {
          return st.hands[i].length + (st.hands[i].length === 1 ? ' card' : ' cards') + (i === 2 ? ' · partner' : '');
        },
        st.turn > 0 && !st.end ? st.turn : -1
      );
      // Each team's taken pile, laid out like the two-player table so the two piles line up.
      var taken = function (t, label) {
        var n = st.caps[t].length + st.caps[t + 2].length,
          xs = st.xc[t].concat(st.xc[t + 2]);
        return (
          '<div class="tpile" role="img" aria-label="' + esc(label) + ' taken pile: ' + n + ' cards">' +
          '<div class="tstack">' +
          xs
            .map(function (c) {
              return '<span class="card peek' + (c.s === 1 || c.s === 2 ? ' red' : '') + '">' + cardFace(c) + '</span>';
            })
            .join('') +
          '<span class="tback' + (n ? '' : ' nil') + '">' + n + '</span></div>' +
          '<span class="tl">' + esc(label) + '<br>taken pile' + (xs.length ? '<br>' + xs.length + (xs.length === 1 ? ' xeri' : ' xeris') : '') + '</span></div>'
        );
      };
      var shown = st.pile.slice(-6);
      out +=
        '<div class="xtable">' +
        '<div class="xrow xmine">' + taken(1, 'Their') + '</div>' +
        '<div class="xmid"><div class="deckbox">' +
        (st.deck.length
          ? '<div class="deckstack">' +
            (st.revealed || [])
              .filter(function (c) {
                return st.deck.indexOf(c) >= 0;
              })
              .map(function (c) {
                return '<span class="card peek' + (c.s === 1 || c.s === 2 ? ' red' : '') + '" role="img" aria-label="Shown at the bottom of the deck: ' + esc(nameOf(c)) + '">' + cardFace(c) + '</span>';
              })
              .join('') +
            '<span class="card back"></span></div>'
          : '<span class="card ghostcard"></span>') +
        '<span><b>Deck</b> · ' + (st.deck.length ? st.deck.length + ' left' : 'empty') + '</span></div>' +
        '<div class="pilebox"><div class="pile" aria-label="Pile">' +
        (shown.length
          ? (st.pile.length > shown.length ? '<span class="buried">+' + (st.pile.length - shown.length) + '</span>' : '') +
            shown
              .map(function (c, i) {
                return '<span class="card' + (c.s === 1 || c.s === 2 ? ' red' : '') + (i === shown.length - 1 ? ' top' : '') + '"' + ' data-fly="' + c.id + '">' + cardFace(c) + '</span>';
              })
              .join('')
          : '<span class="pempty">The table is empty</span>') +
        '</div><span class="pilecount">' + (st.pile.length ? st.pile.length + (st.pile.length === 1 ? ' card on the table' : ' cards on the table') : '') + '</span></div></div>' +
        '<div class="xrow xmine">' + taken(0, 'Your team’s') + '</div></div>';
      out += handButtons(st.hands[0], {
        can: function () {
          return my;
        },
        mark: function (c) {
          return easyMode() && my && top && (c.r === top.r || c.r === 11);
        }
      });
      return out + note(st.hand === 2 && st.deck.length === 0 ? 'Last hand.' : '');
    },
    nextLabel: 'Next deal'
  });

  // Tuned by simulation: Hard calls trump readily and bids boldly; Easy is timid and plays loosely.
  EU.TH = { easy: 7.6, hard: 5.6 };
  OH.OFF = { easy: 0, hard: 0 };
  WZ.OFF = { easy: 0, hard: 0 };
  PN.OFF = { easy: 20, hard: 100 };
  R5.undoable = function (st, mv) {
    return !!(mv.meld || mv.lay || mv.take != null);
  };
  CN.undoable = function (st, mv) {
    return !!(mv.meld || mv.add || mv.take);
  };
  BB.undoable = function (st, mv) {
    return !!((mv.meld || mv.add) && st.hands[st.next].length > (mv.meld ? mv.meld.length : mv.add.length));
  };
  P10.undoable = function (st, mv) {
    return !!(mv.lay || mv.hit);
  };
  LC.undoable = function (st, mv) {
    return !!(mv.play || mv.discard) && !('take' in mv);
  };
  GOLF.undoable = function (st, mv) {
    return mv.draw === 'pile';
  };
  MT.undoable = function (st, mv) {
    return !!mv.play;
  };
  KK.undoable = function (st, mv) {
    return !!(mv.meld || mv.add || mv.swap || mv.draw === 'pile');
  };
  GIN.undoable = function (st, mv) {
    return mv.draw === 'pile';
  };
  FC.undoable = function (st, mv) {
    return mv.draw === 'pile';
  };
  Object.keys(GMS).forEach(function (k) {
    if (VSK[k]) {
      START[k] = START.gm;
      VIEW[k] = VIEW.gm;
      ACT[k] = ACT.gm;
    }
  });

  start();
})();
</script>
