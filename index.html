<style>
/* Layout: a single column score pad. Games list first; inside a game, standings on top,
   then the round-by-round sheet (rows = rounds, grouped columns = players), setup below. */
:root {
  --bg: #f1f5f2;

  --accent: #1d6a49;
  --accent-ink: #ffffff;
  --lead: #b97a12;

  --display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1613; --surface: #18221d; --sunk: #202c26; --ink: #e7efea; --muted: #93a39a;
    --line: #2c3a33; --accent: #52c08c; --accent-ink: #0b1410; --lead: #e6b04a; --danger: #f08273;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1613; --surface: #18221d; --sunk: #202c26; --ink: #e7efea; --muted: #93a39a;
  --line: #2c3a33; --accent: #52c08c; --accent-ink: #0b1410; --lead: #e6b04a; --danger: #f08273;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 15px; line-height: 1.45;
}
.wrap {
  max-width: 980px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px;
}
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 26px; letter-spacing: -0.01em; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }
p { margin: 0; }
.muted { color: var(--muted); }
.status { font-size: 13px; color: var(--muted); }
.status.warn { color: var(--danger); }

button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 9px 14px; font-weight: 500; min-height: 40px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.armed { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn.small { padding: 4px 9px; min-height: 30px; font-size: 13px; }

.field {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 9px 12px; min-height: 40px; font-size: 16px; min-width: 0;
}
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row .field { flex: 1 1 180px; }

/* Home */
.head { display: flex; flex-direction: column; gap: 4px; }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.game {
  text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0;
}
.game strong { font-family: var(--display); font-size: 17px; overflow-wrap: anywhere; }
.game span { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.game .who { color: var(--ink); }
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 22px; color: var(--muted); }

/* Game view */
.top { display: flex; gap: 8px; align-items: center; }
.title {
  flex: 1; min-width: 0; font-family: var(--display); font-weight: 700; font-size: 22px;
  border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 6px 8px;

.stand.lead { border-color: var(--lead); }

.sheet { overflow-x: auto; width: fit-content; max-width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
thead th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--sunk); }
thead th.pl { text-align: center; font-family: var(--display); font-size: 14px; color: var(--ink); }
th.unscored { font-weight: 400; font-style: italic; }
.g { border-left: 1px solid var(--line); }
td.rd, th.rd { text-align: center; color: var(--muted); width: 2.4em; position: sticky; left: 0; background: var(--surface); }
thead th.rd { background: var(--sunk); }
td.dl, th.dl { text-align: left; }

.cell {
  width: 3.6em; text-align: right; font-size: 16px; padding: 5px 4px;
  border: 0; border-bottom: 1px solid var(--line); background: transparent; border-radius: 0;
  font-variant-numeric: tabular-nums;
}
.cell:focus { outline: none; border-bottom-color: var(--accent); box-shadow: inset 0 -1px 0 var(--accent); background: var(--sunk); }
.dealer {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 4px 8px; font-size: 13px; max-width: 8.5em;
}
.x { border: 0; background: transparent; color: var(--muted); padding: 4px 8px; border-radius: 6px; font-size: 13px; }
.x.armed { background: var(--danger); color: var(--surface); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.actions .hint { font-size: 13px; color: var(--muted); }
.dchip {
  display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%;
  border: 1.5px solid currentColor; font-size: 11px; font-weight: 700; margin-right: 4px;
}

.pname { border: 0; background: transparent; padding: 2px 4px; border-radius: 6px; display: inline-flex; align-items: center; font-weight: 600; }
.pname .dchip { color: var(--accent); }
/* The D keeps its space when hidden, so moving it never changes a column's width. */
.dchip.off { visibility: hidden; }
.over { background: var(--accent); color: var(--accent-ink); width: fit-content; max-width: 100%; border-radius: 12px; padding: 22px 20px; display: flex; align-items: center; gap: 14px; }
.over > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cup { flex: none; }
@media (prefers-reduced-motion: no-preference) {
  .over.pop { animation: pop .6s cubic-bezier(.2, 1.4, .4, 1) both; }
  .over.pop .cup { animation: wig 1.2s ease-in-out .3s 2; }
}
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes wig { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
.over p { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; }
.over h1 { font-size: 28px; overflow-wrap: anywhere; }
.finaltable .cell, .finaltable .pname { pointer-events: none; }
.finaltable .x { display: none; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.note { font-size: 13px; color: var(--muted); max-width: 65ch; }
td.rd.lbl { text-align: left; width: auto; color: var(--ink); font-size: 13px; }
.cell[readonly] { color: var(--muted); }
.tpl { display: inline-flex; align-items: center; }
.endrow { display: flex; justify-content: flex-end; }
.modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); display: grid; place-items: center; padding: 16px; z-index: 60; }
.dialog { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 20px; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
.dialog h3 { font-size: 18px; }
.dialog .row { justify-content: flex-end; }
.noterow { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.noterow .btn { flex: none; }
.rules { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 10px; max-width: 65ch; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--line); }
.tab { border: 0; background: transparent; padding: 8px 10px; font-size: 13px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.rowd { width: 16px; height: 16px; font-size: 9px; color: var(--accent); margin-right: 3px; vertical-align: middle; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.field:disabled { opacity: .6; }
.cell:disabled { opacity: .4; cursor: not-allowed; }
.lockmsg { font-weight: 600; color: var(--lead); max-width: 65ch; }
.lbhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.lbhead .dealer { max-width: 12em; }
.lbsheet { width: 100%; }
.lb { width: 100%; }
.lb th.who, .lb td.who { text-align: left; white-space: normal; overflow-wrap: anywhere; }
.lb .rk { text-align: center; color: var(--muted); width: 2.4em; }
.lb tbody tr:last-child td { border-bottom: 0; }
.lbname { border: 0; background: transparent; padding: 2px 0; font-weight: 600; text-align: left; overflow-wrap: anywhere; }
.lb tr.first .lbname { color: var(--lead); }
.lbmore td { text-align: left; white-space: normal; font-size: 13px; color: var(--muted); background: var(--sunk); }
.pickrow { display: flex; gap: 8px; }
.pickrow select { flex: 1; min-width: 0; }
.pickrow .btn { flex: none; }
#picks { display: flex; flex-direction: column; gap: 8px; }
#picks:empty { display: none; }
.grp { font-size: 12px; color: var(--muted); }
.tight th, .tight td { padding: 6px 4px; }
.tight th.rd, .tight td.rd { padding-left: 8px; }
.cell.bad { box-shadow: inset 0 -2px 0 var(--danger); background: var(--sunk); }
.grprow td { background: var(--sunk); font-weight: 600; font-size: 13px; }
.grprow td.rd { background: var(--sunk); color: var(--ink); }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40; box-shadow: 0 2px 10px rgba(0, 0, 0, .2); }
.fabspace { height: 36px; }
/* Per-game colour: each game sets a hue, and the accent, header tint and lines follow it in both themes. */
.themed { --accent: hsl(var(--h) var(--s, 55%) 30%); --sunk: hsl(var(--h) 34% 93%); --line: hsl(var(--h) 18% 84%); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .themed { --accent: hsl(var(--h) var(--s, 55%) 70%); --sunk: hsl(var(--h) 22% 17%); --line: hsl(var(--h) 14% 26%); }
}
:root[data-theme="dark"] .themed { --accent: hsl(var(--h) var(--s, 55%) 70%); --sunk: hsl(var(--h) 22% 17%); --line: hsl(var(--h) 14% 26%); }
.t-hearts { --h: 350; --s: 65%; } .t-spades { --h: 228; --s: 45%; } .t-euchre { --h: 150; --s: 50%; } .t-pinochle { --h: 14; --s: 65%; }
.t-ohhell { --h: 24; --s: 75%; } .t-wizard { --h: 268; --s: 50%; } .t-gin { --h: 172; --s: 55%; } .t-rummy { --h: 200; --s: 60%; }
.t-canasta { --h: 36; --s: 70%; } .t-cribbage { --h: 26; --s: 40%; } .t-phase10 { --h: 190; --s: 65%; } .t-uno { --h: 4; --s: 70%; }
.t-golf { --h: 135; --s: 50%; } .t-fivecrowns { --h: 44; --s: 75%; } .t-train { --h: 16; --s: 55%; } .t-farkle { --h: 285; --s: 45%; }
.t-scrabble { --h: 160; --s: 50%; } .t-yahtzee { --h: 222; --s: 60%; } .t-biriba { --h: 212; --s: 70%; } .t-xeri { --h: 212; --s: 70%; }
.t-diloti { --h: 212; --s: 70%; } .t-tavli { --h: 22; --s: 45%; } .t-lostcities { --h: 32; --s: 60%; }
.gi { display: inline-grid; place-items: center; width: 1.15em; height: 1.15em; margin-right: 6px; color: var(--accent); vertical-align: -0.2em; flex: none; }
.gi svg { width: 100%; height: 100%; display: block; }
.gi.big { width: 30px; height: 30px; margin-right: 0; }
.themed thead th.pl { color: var(--accent); }
.game.themed { background: var(--sunk); border-color: var(--line); }
.game.themed strong { color: var(--accent); }
.game.themed .gi { width: 1.3em; height: 1.3em; margin-right: 8px; color: var(--accent); font-size: inherit; }
/* History card: the card opens the game; the date and delete control sit on the title line at the right. */
.game { padding: 0; flex-direction: row; align-items: flex-start; gap: 0; }
.gopen { flex: 1; min-width: 0; text-align: left; border: 0; background: transparent; padding: 14px 6px 14px 14px; display: flex; flex-direction: column; gap: 4px; border-radius: 10px; }
.gside { flex: none; display: flex; align-items: center; gap: 2px; padding: 11px 6px 0 0; }
.game .gdate { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.gside .x.armed { font-size: 12px; }
.endrow { justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.iobtns { display: flex; gap: 6px; }
.dialog.wide { max-width: 440px; width: 100%; }
.iotext { width: 100%; height: 120px; resize: vertical; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
#imp-file { max-width: 100%; font-size: 14px; }

.setup-body { padding: 0 14px 16px; display: flex; flex-direction: column; gap: 18px; }
.group { display: flex; flex-direction: column; gap: 8px; }

.item .field { flex: 1 1 140px; min-height: 36px; padding: 6px 10px; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .btn, .game { transition: border-color .12s; } }
.game:hover { border-color: var(--accent); }
/* Play against the computer: a full-screen table over the score sheet, in the game's own colour. */
.vsdlg { max-width: 360px; width: 100%; }
.vslbl { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }

.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }

.segb + .segb { border-left: 1px solid var(--line); }

.pwrap {
  max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
}
.ptop { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-left: -8px; }
.psub { font-size: 13px; color: var(--muted); text-align: right; }

.pstands { display: flex; gap: 8px; }

.stand.turn { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.pmsg { font-weight: 600; min-height: 1.45em; }

.pbtns { display: flex; gap: 8px; flex-wrap: wrap; }

.pbtns:empty { display: none; }
.pempty { color: var(--muted); font-size: 13px; }

/* Cards keep a light face in both themes, like real ones. */
.card {

  border: 1px solid rgba(0, 0, 0, .2); box-shadow: 0 1px 2px rgba(0, 0, 0, .18);

}

  button.card:not(:disabled) { transition: transform .12s; }
  button.card:not(:disabled):hover { transform: translateY(-3px); }
  .pile .card.new { animation: drop .25s ease-out; }
  .pile.taking .card, .pile.taking .buried { animation: take .45s ease-in 2.7s forwards; }
  .pile.to-me .card { --dy: 70px; }
  .pile.to-cpu .card { --dy: -70px; }
  .die.roll, .tdie.roll { animation: tumble .4s ease-out; }
  .die.sel { transition: transform .12s; }
}
@keyframes drop { from { transform: translateY(-16px); opacity: .3; } }
@keyframes take { to { transform: translateY(var(--dy, 60px)) scale(.85); opacity: 0; } }
@keyframes tumble { from { transform: rotate(-40deg) scale(.7); opacity: .3; } }

/* Dice */
.fkturn { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.fkturn .n { font-size: 13px; color: var(--muted); }
.fkturn .big { font-family: var(--display); font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--accent); }
.dice { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; min-height: 54px; align-items: center; }
.dice.kept { min-height: 34px; gap: 5px; }
.die {
  width: 48px; height: 48px; flex: none; border-radius: 10px; background: #fffdf7; border: 1px solid rgba(0, 0, 0, .2);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .2); display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 7px;
}
.die i { width: 9px; height: 9px; border-radius: 50%; place-self: center; }
.die i.on { background: #1c1c1e; }
.die.sel { box-shadow: 0 0 0 3px var(--accent); transform: translateY(-5px); }
.die.kept { width: 30px; height: 30px; padding: 4px; border-radius: 7px; opacity: .7; }
.die.kept i { width: 5px; height: 5px; }
.die.dead { opacity: .4; }
button.die { cursor: pointer; }
.fkhelp { font-size: 13px; color: var(--muted); }
.fkhelp summary { cursor: pointer; font-weight: 600; }
.fkhelp p { margin-top: 6px; max-width: 65ch; }

/* Tavli board */
.tboard { width: 100%; height: auto; display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.tb-frame { fill: hsl(24 38% 30%); }
.tb-felt { fill: hsl(38 48% 86%); }
.tb-tray { fill: hsl(24 34% 22%); }
.tb-p0 { fill: hsl(14 48% 44%); }
.tb-p1 { fill: hsl(34 30% 60%); }
.tb-tgt, .tb-tgtf { fill: hsl(48 95% 56%); }
.ck { stroke-width: 1.5; }
.ck0 { fill: #faf5e8; stroke: #6d5b45; }
.ck1 { fill: #2a2320; stroke: #0b0807; }
.ckin { fill: none; stroke-width: 1; }
.ck0i { stroke: #c9b99b; }
.ck1i { stroke: #5a4c44; }
.ckn { font: 700 14px var(--body); text-anchor: middle; }
.ck0t { fill: #3a2f24; }
.ck1t { fill: #f2ebe0; }
.tb-can { stroke: hsl(48 95% 52%); stroke-width: 3; }
.tb-sel { stroke: hsl(48 95% 52%); stroke-width: 5; }
.tb-last { stroke: hsl(200 85% 55%); stroke-width: 3.5; }
.tb-pin { opacity: .85; }
.tb-hit { fill: transparent; cursor: pointer; }
.tdie rect { fill: #fffdf7; stroke: #3a2f24; stroke-width: 1.2; }
.tdie circle { fill: #1c1c1e; }
.tdie.used { opacity: .35; }
.tdie { transform-box: fill-box; transform-origin: center; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .tb-felt { fill: hsl(30 18% 24%); }
  :root:not([data-theme="light"]) .tb-p0 { fill: hsl(14 40% 40%); }
  :root:not([data-theme="light"]) .tb-p1 { fill: hsl(32 16% 40%); }
  :root:not([data-theme="light"]) .tb-frame { fill: hsl(24 30% 16%); }
  :root:not([data-theme="light"]) .ck1 { stroke: #a8968a; }
}
:root[data-theme="dark"] .tb-felt { fill: hsl(30 18% 24%); }
:root[data-theme="dark"] .ck1 { stroke: #a8968a; }
:root[data-theme="dark"] .tb-p0 { fill: hsl(14 40% 40%); }
:root[data-theme="dark"] .tb-p1 { fill: hsl(32 16% 40%); }

@media (max-width: 380px) {
  .card { width: 44px; height: 64px; }
  .die { width: 44px; height: 44px; }
}
</style>

<div class="wrap" id="app"></div>

<script>
(function () {
  var app = document.getElementById('app');
  var games = {};          // id -> game
  var currentId = null;
  var db = null;
  var mode = 'loading';    // loading | shared | local
  var slow = false, readOnly = false;
  var ui = { setupOpen: null, armed: null, lastCell: null };
  var dirty = new Set(), saving = new Set(), timers = {};
  var templates = {}, pendTpl = new Set(), LST = 'scorepad.templates';
  var LS = 'scorepad.games', LSCUR = 'scorepad.current';

  function titleCase(s) {
    return String(s || '').trim().toLowerCase().replace(/(^|[\s\-(\/])(\S)/g, function (m, a, b) { return a + b.toUpperCase(); });
  }
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function fmt(n) { return Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100); }
  // Accepts 12, -3, 1.5, 1,5 (decimal comma), 1,250 (thousands), and a typographic minus. Anything else is not a score.
  function parseScore(v) {
    var t = String(v == null ? '' : v).replace(/\u2212/g, '-').replace(/\s/g, '');
    if (/^[-+]?\d{1,3}(,\d{3})+(\.\d+)?$/.test(t)) t = t.replace(/,/g, '');
    else t = t.replace(',', '.');
    if (!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(t)) return NaN;
    return parseFloat(t);
  }
  function num(v) { return typeof v === 'number' && isFinite(v) ? v : 0; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} if (k === LS || k === LST || k === LSCUR) mirror(); }

  /* ---------- installed app: when running as an ordinary web page, a second copy of the save is kept in IndexedDB ---------- */
  var IDB = null, mirrorT = null;
  function standalonePage() { return !(window.claude && window.claude.use); }
  function idbOpen() {
    if (!IDB) {
      IDB = new Promise(function (res, rej) {
        if (!window.indexedDB) { rej(new Error('no indexedDB')); return; }
        var r = indexedDB.open('scorepad', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('save'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error); };
      });
      IDB.catch(function () {});
    }
    return IDB;
  }
  function idbReq(mode, fn) {
    return idbOpen().then(function (d) {
      return new Promise(function (res, rej) {
        var t = d.transaction('save', mode), q = fn(t.objectStore('save'));
        t.oncomplete = function () { res(q && q.result); };
        t.onerror = t.onabort = function () { rej(t.error); };
      });
    });
  }
  function mirror() {
    if (!standalonePage()) return;
    clearTimeout(mirrorT);
    mirrorT = setTimeout(function () {
      var snap = { games: lsGet(LS) || '{}', templates: lsGet(LST) || '{}', current: lsGet(LSCUR) || '', at: Date.now() };
      idbReq('readwrite', function (s) { return s.put(snap, 'all'); }).catch(function () {});
    }, 300);
  }
  // If the browser ever clears its quick storage, bring the games back from the IndexedDB copy.
  function idbRestore() {
    idbReq('readonly', function (s) { return s.get('all'); }).then(function (snap) {
      if (!snap) { mirror(); return; }
      var back = {}, changed = false;
      try { back = JSON.parse(snap.games || '{}') || {}; } catch (e) { back = {}; }
      Object.keys(back).forEach(function (k) {
        var g = back[k]; if (!g || typeof g !== 'object') return;
        if (!games[k] || (g.updatedAt || 0) > (games[k].updatedAt || 0)) { normalize(g); games[k] = g; changed = true; }
      });
      if (!lsGet(LST) && snap.templates) { try { templates = JSON.parse(snap.templates) || {}; lsSet(LST, snap.templates); changed = true; } catch (e) {} }
      if (!lsGet(LSCUR) && snap.current && games[snap.current]) lsSet(LSCUR, snap.current);
      if (changed) { saveLocal(); render(); } else mirror();
    }, function () {});
  }

  function normalize(g) {
    g = g || {};
    var ok = function (x) { return !!x && typeof x === 'object' && typeof x.id === 'string' && x.id !== ''; };
    g.players = Array.isArray(g.players) ? g.players.filter(ok) : [];
    if (Array.isArray(g.columns)) g.columns = g.columns.filter(ok);
    if (!Array.isArray(g.columns) || !g.columns.length) g.columns = [{ id: 'pts', name: 'Points', scored: true }];
    g.rounds = Array.isArray(g.rounds) ? g.rounds.filter(ok) : [];
    g.rounds.forEach(function (r) { if (!r.s || typeof r.s !== 'object') r.s = {}; });
    if (typeof g.title !== 'string' || !g.title.trim()) g.title = 'Untitled Game';
    if (Array.isArray(g.cycle)) g.cycle = g.cycle.filter(function (x) { return typeof x === 'string' && x !== ''; }); else delete g.cycle;
    return g;
  }

  /* ---------- scoring ---------- */
  function cellVal(r, pid, cid) { return r.s[pid] ? r.s[pid][cid] : null; }
  function roundScore(g, r, pid) {
    var t = 0;
    g.columns.forEach(function (c) { if (c.scored) t += num(cellVal(r, pid, c.id)); });
    return t;
  }
  function runningTotals(g, pid) {
    var t = 0;
    return g.rounds.map(function (r) { t += roundScore(g, r, pid); return t; });
  }
  function colTotal(g, pid, cid) {
    return g.rounds.reduce(function (t, r) { return t + num(cellVal(r, pid, cid)); }, 0);
  }
  function total(g, pid) {
    return g.rounds.reduce(function (t, r) { return t + roundScore(g, r, pid); }, 0);
  }
  function ranked(g) {
    var list = g.players.map(function (p) { return { p: p, t: total(g, p.id) }; });
    list.sort(function (a, b) { return g.lowWins ? a.t - b.t : b.t - a.t; });
    return list;
  }
  function leader(g) {
    var r = ranked(g);
    if (!g.rounds.length || !r.length) return null;
    if (r.length > 1 && r[0].t === r[1].t) return null;
    return r[0];
  }
  function winnerText(g) {
    var r = ranked(g);
    if (!r.length) return 'No players';
    var top = r.filter(function (x) { return x.t === r[0].t; });
    if (top.length === 1) return top[0].p.name + ' wins with ' + fmt(top[0].t);
    return 'Tie at ' + fmt(r[0].t) + ': ' + top.map(function (x) { return x.p.name; }).join(', ');
  }
  function nextDealer(g) {
    if (!g.players.length) return '';
    var last = g.rounds[g.rounds.length - 1];
    if (!last) return g.players.some(function (p) { return p.id === g.firstDealer; }) ? g.firstDealer : g.players[0].id;
    if (!last.dealer) return g.players[0].id;
    var i = g.players.findIndex(function (p) { return p.id === last.dealer; });
    return g.players[(i + 1) % g.players.length].id;
  }
  function playerName(g, pid) {
    var p = g.players.find(function (x) { return x.id === pid; });
    return p ? p.name : '';
  }

  /* ---------- saving ---------- */
  function saveLocal() { lsSet(LS, JSON.stringify(games)); }
  function loadLocal() {
    try { var o = JSON.parse(lsGet(LS) || '{}'); Object.keys(o).forEach(function (k) { normalize(o[k]); }); return o; } catch (e) { return {}; }
  }
  // Every change marks the game as used, except the save that creates it.
  function touch(id, creating) {
    if (!games[id]) return;
    games[id].used = !creating;
    games[id].updatedAt = Date.now();
    if (mode === 'local') { saveLocal(); return; }
    dirty.add(id);
    clearTimeout(timers[id]);
    timers[id] = setTimeout(function () { flush(id); }, 500);
  }
  function flush(id) {
    if (mode === 'loading') return;
    if (mode !== 'shared' || !db) { saveLocal(); dirty.delete(id); return; }
    if (saving.has(id)) return;
    if (!games[id]) { dirty.delete(id); return; }
    saving.add(id); dirty.delete(id);
    db.collection('games').doc(id).set(clone(games[id])).then(function () {
      readOnly = false;
    }, function (e) {
      if (e && e.code === 'invalid_argument') readOnly = true;
      saveLocal();
    }).then(function () {
      saving.delete(id);
      if (dirty.has(id)) flush(id);
      setStatus();
    });
  }
  // A game that was opened and left with nothing entered: no players, scores or changes.
  function isUnused(g) { return g.used === false && !g.over && !g.players.length && !hasScores(g); }
  function historyList() {
    return Object.keys(games).map(function (id) { return games[id]; }).filter(function (g) { return !isUnused(g); })
      .sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
  }
  // Unused games left behind by a closed tab are cleared after a day.
  function pruneUnused() {
    var cutoff = Date.now() - 86400000;
    Object.keys(games).forEach(function (id) {
      var g = games[id];
      if (id !== currentId && isUnused(g) && (g.createdAt || 0) < cutoff) removeGame(id);
    });
  }
  function removeGame(id) {
    delete games[id]; dirty.delete(id); clearTimeout(timers[id]);
    if (mode === 'shared' && db) db.collection('games').doc(id).delete().catch(function () {});
    else saveLocal();
  }

  /* ---------- rendering ---------- */
  function statusText() {
    if (readOnly) return ['You have view-only access, so changes here are not being saved.', true];
    if (mode === 'loading') return [slow ? 'Saved games can’t be reached yet. Still trying.' : 'Loading saved games…', slow];
    if (mode === 'local') return ['Saved on this device only.', false];
    return [slow ? 'Scores may be out of date. Reconnecting.' : 'Saved automatically. Everyone you share this page with sees the same scores.', slow];
  }
  function setStatus() {
    var el = document.getElementById('status'); if (!el) return;
    var s = statusText(); el.textContent = s[1] ? s[0] : ''; el.hidden = !el.textContent; el.className = 'status' + (s[1] ? ' warn' : '');
  }
  function armBtn(key, label, cls) {
    var on = ui.armed === key;
    return '<button type="button" class="' + cls + (on ? ' armed' : '') + '" data-act="arm" data-key="' + esc(key) + '">' + (on ? 'Tap again to confirm' : label) + '</button>';
  }

  /* ---------- choosing a game: search, quick start, grouped list, drop-down ---------- */
  function presetIndex(name) { for (var i = 0; i < PRESETS.length; i++) if (PRESETS[i].name === name) return i; return -1; }
  function templateIds() {
    return Object.keys(templates).sort(function (a, b) { return (templates[a].createdAt || 0) - (templates[b].createdAt || 0); });
  }
  // The built-in games played most often in History, most played first, then most recent.
  function favourites(list, limit) {
    var seen = Object.create(null), order = [];
    list.forEach(function (g) {
      var n = gameName(g), i = presetIndex(n);
      if (i < 0) return;
      if (!seen[n]) { seen[n] = { i: i, n: 0, at: 0 }; order.push(n); }
      seen[n].n++; seen[n].at = Math.max(seen[n].at, g.updatedAt || 0);
    });
    return order.map(function (n) { return seen[n]; })
      .sort(function (a, b) { return b.n - a.n || b.at - a.at || a.i - b.i; })
      .slice(0, limit || 5).map(function (x) { return x.i; });
  }
  // Built-in games whose name, or whose group name, contains the search text.
  function matchGames(q) {
    q = String(q == null ? '' : q).trim().toLowerCase();
    if (!q) return [];
    var out = [];
    GROUPS.forEach(function (grp) {
      // A group matches on the start of one of its words ("greek", "dice", "tiles"), from three letters up.
      var inGroup = q.length >= 3 && grp[0] !== 'Other' && grp[0].toLowerCase().split(/[\s-]+/).some(function (w) { return w.indexOf(q) === 0; });
      grp[1].forEach(function (n) {
        var i = presetIndex(n);
        if (i >= 0 && (n.toLowerCase().indexOf(q) >= 0 || inGroup)) out.push(i);
      });
    });
    return out.sort(function (a, b) { return a - b; });
  }
  function chipHTML(i) { return '<button type="button" class="btn small" data-act="preset" data-i="' + i + '">' + iconHTML(THEMES[PRESETS[i].name]) + esc(PRESETS[i].name) + '</button>'; }
  function tplChipHTML(id) {
    return '<span class="tpl"><button type="button" class="btn small" data-act="tpl" data-id="' + esc(id) + '">' + esc(templates[id].name || 'Untitled Game') + '</button>' + armBtn('tpl:' + id, '\u00d7', 'x') + '</span>';
  }
  function picksHTML(list, query) {
    var q = String(query == null ? '' : query).trim().toLowerCase(), tids = templateIds();
    if (q) {
      var hits = matchGames(q), thits = tids.filter(function (id) { return String(templates[id].name || '').toLowerCase().indexOf(q) >= 0; });
      if (!hits.length && !thits.length) return '<p class="grp">No saved game matches. Tap Custom Game to start a new one with this title.</p>';
      return '<p class="grp">Matches</p><div class="presets">' + hits.map(chipHTML).join('') + thits.map(tplChipHTML).join('') + '</div>';
    }
    var out = '', fav = favourites(list);
    if (fav.length) out += '<p class="grp">Most played</p><div class="presets">' + fav.map(chipHTML).join('') + '</div>';
    if (tids.length) out += '<p class="grp">Your templates</p><div class="presets">' + tids.map(tplChipHTML).join('') + '</div>';
    if (ui.allOpen) {
      out += GROUPS.map(function (grp) {
        return '<p class="grp">' + esc(grp[0]) + '</p><div class="presets">' + grp[1].map(function (n) { return presetIndex(n); }).filter(function (i) { return i >= 0; }).map(chipHTML).join('') + '</div>';
      }).join('');
    }
    return out;
  }
  function pickOptions() {
    var tids = templateIds();
    return '<option value="">Choose a game\u2026</option>' + GROUPS.map(function (grp) {
      return '<optgroup label="' + esc(grp[0]) + '">' + grp[1].map(function (n) { var i = presetIndex(n); return i < 0 ? '' : '<option value="p:' + i + '">' + esc(n) + '</option>'; }).join('') + '</optgroup>';
    }).join('') + (tids.length ? '<optgroup label="Your templates">' + tids.map(function (id) {
      return '<option value="t:' + esc(id) + '">' + esc(templates[id].name || 'Untitled Game') + '</option>';
    }).join('') + '</optgroup>' : '');
  }

  /* ---------- leaderboard: wins across finished games ---------- */
  function gameName(g) { return (typeof g.rk === 'string' && g.rk) || g.title; }
  function hasScores(g) { return g.rounds.some(function (r) { return !rowEmpty(r); }); }
  // Counts only games ended with Game Over that have at least one score. Players are matched by name,
  // ignoring capitals and extra spaces. A tie at the top is a win for each tied player.
  function leaderboard(list, filter) {
    var done = list.filter(function (g) { return g.over && g.players.length && hasScores(g); });
    var names = [];
    done.forEach(function (g) { if (names.indexOf(gameName(g)) < 0) names.push(gameName(g)); });
    names.sort(function (a, b) { return a.localeCompare(b); });
    if (filter && names.indexOf(filter) < 0) filter = '';
    var when = function (g) { return g.endedAt || g.updatedAt || 0; };
    var map = Object.create(null), order = [];
    done.filter(function (g) { return !filter || gameName(g) === filter; })
      .sort(function (a, b) { return when(a) - when(b); })
      .forEach(function (g) {
        var r = ranked(g), top = r[0].t, seen = Object.create(null);
        r.forEach(function (x) {
          var key = String(x.p.name || '').trim().replace(/\s+/g, ' ').toLowerCase();
          if (!key) return;
          var won = x.t === top;
          if (seen[key]) { if (won && !seen[key].won) seen[key].won = true; return; }
          seen[key] = { won: won, name: String(x.p.name).trim().replace(/\s+/g, ' ') };
        });
        Object.keys(seen).forEach(function (key) {
          var e = map[key];
          if (!e) { e = map[key] = { key: key, name: seen[key].name, wins: 0, played: 0, streak: 0, lastWin: '', by: Object.create(null) }; order.push(key); }
          var gn = gameName(g);
          e.name = seen[key].name; e.played++;
          if (!e.by[gn]) e.by[gn] = { w: 0, p: 0 };
          e.by[gn].p++;
          if (seen[key].won) { e.wins++; e.streak++; e.lastWin = gn; e.by[gn].w++; } else e.streak = 0;
        });
      });
    var rows = order.map(function (k) { return map[k]; });
    rows.forEach(function (e) { e.rate = e.played ? e.wins / e.played : 0; });
    rows.sort(function (a, b) { return b.wins - a.wins || b.rate - a.rate || b.played - a.played || a.name.localeCompare(b.name); });
    rows.forEach(function (e, i) { e.rank = i > 0 && rows[i - 1].wins === e.wins && rows[i - 1].played === e.played ? rows[i - 1].rank : i + 1; });
    return { rows: rows, names: names, filter: filter || '', count: done.length };
  }
  function leaderHTML(list) {
    if (!list.length) return '';
    var lb = leaderboard(list, ui.lbFilter || '');
    if (!lb.count) return '<h2>Leaderboard</h2><div class="empty">Finish a game with End Game and its winner will appear here.</div>';
    var opts = '<option value="">All games</option>' + lb.names.map(function (n) {
      return '<option value="' + esc(n) + '"' + (n === lb.filter ? ' selected' : '') + '>' + esc(n) + '</option>';
    }).join('');
    var body = lb.rows.map(function (e) {
      var open = ui.lbOpen === e.key;
      var row = '<tr' + (e.rank === 1 && e.wins ? ' class="first"' : '') + '><td class="rk">' + e.rank + '</td><td class="who"><button type="button" class="lbname" data-act="lbopen" data-key="' + esc(e.key) + '" aria-expanded="' + (open ? 'true' : 'false') + '">' + esc(e.name) + '</button></td>' +

  };
  ACT.farkle = function (a, b) {

  function tvHumanMove(m) {

  VIEW.tavli = function (g) {

  ACT.tavli = function (a, b) {
